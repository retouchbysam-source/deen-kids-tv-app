name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Generate app icon and splash screen
        run: npx @capacitor/assets generate --android || echo "icon generation skipped"
      - name: Sync web app into Android project
        run: npx cap sync android
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deen-Kids-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Deen Kids TV — Android App
          body: Download app-debug.apk below, open it on your Android phone, and tap Install. Allow "install from this source" if asked.
          files: android/app/build/outputs/apk/debug/app-debug.apk
